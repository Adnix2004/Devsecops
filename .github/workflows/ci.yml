name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour que Gitleaks vérifie l'historique Git

      # 1. Détection de fuites de secrets (Secrets Scanning)
      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Analyse statique du code source Node.js (SAST)
      - name: Scan SAST avec Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

      # 3. Scan des dépendances package.json avec Trivy (SCA)
      - name: Scan des dépendances (SCA) avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 4. Build de l'image Docker
      - name: Build de l'image Docker
        run: docker build -t mon-app-express:${{ github.sha }} .

      # 5. Scan de l'image Docker finale (Container Security)
      - name: Scan image Docker avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mon-app-express:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Bloque le pipeline si une faille critique est présente